<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Appointment & Follow-up Manager</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 20px; background: #f4f6f8; color: #333; }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 20px; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e2e8f0; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #2563eb; color: #fff; }
        .portal-card { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button.btn-primary { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .item-card { border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; margin-bottom: 12px; background: #fafafa; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-high { background: #fee2e2; color: #b91c1c; }
        .badge-med { background: #fef3c7; color: #b45309; }
        .badge-low { background: #dcfce7; color: #15803d; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .alert-success { background: #dcfce7; color: #15803d; }
        .alert-error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <h1>Healthcare Appointment & Follow-up Manager</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('patient')">Patient Portal</button>
        <button class="tab-btn" onclick="switchTab('doctor')">Doctor Portal</button>
        <button class="tab-btn" onclick="switchTab('admin')">Admin Portal</button>
    </div>

    <!-- PATIENT PORTAL -->
    <div id="patient-portal" class="portal-card">
        <h2>Book an Appointment</h2>
        <div id="patient-msg" class="alert"></div>
        <form id="bookForm" onsubmit="handleBook(event)">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="patientName" required placeholder="e.g. Jane Doe">
            </div>
            <div class="form-group">
                <label>Select Doctor & Specialisation</label>
                <select id="doctorSelect" required></select>
            </div>
            <div class="form-group">
                <label>Date & Time Slot</label>
                <input type="datetime-local" id="startTime" required>
            </div>
            <div class="form-group">
                <label>Symptoms (Pre-visit Analysis)</label>
                <textarea id="symptoms" rows="3" required placeholder="Describe what you are experiencing..."></textarea>
            </div>
            <button type="submit" class="btn-primary">Confirm Booking</button>
        </form>
    </div>

    <!-- DOCTOR PORTAL -->
    <div id="doctor-portal" class="portal-card" style="display:none;">
        <h2>Doctor Appointments & Clinical Notes</h2>
        <div id="doctor-msg" class="alert"></div>
        <div id="appointment-list">Loading appointments...</div>
    </div>

    <!-- ADMIN PORTAL -->
    <div id="admin-portal" class="portal-card" style="display:none;">
        <h2>Admin Management: Mark Doctor Leave</h2>
        <div id="admin-msg" class="alert"></div>
        <form id="leaveForm" onsubmit="handleLeave(event)">
            <div class="form-group">
                <label>Select Doctor</label>
                <select id="adminDoctorSelect" required></select>
            </div>
            <div class="form-group">
                <label>Leave Date</label>
                <input type="date" id="leaveDate" required>
            </div>
            <button type="submit" class="btn-primary" style="background:#dc2626;">Apply Leave & Cancel Conflicting Bookings</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.portal-card').forEach(p => p.style.display = 'none');
            
            if (tab === 'patient') {
                document.getElementById('patient-portal').style.display = 'block';
                event.target.classList.add('active');
            } else if (tab === 'doctor') {
                document.getElementById('doctor-portal').style.display = 'block';
                event.target.classList.add('active');
                loadDoctorAppointments();
            } else if (tab === 'admin') {
                document.getElementById('admin-portal').style.display = 'block';
                event.target.classList.add('active');
            }
        }

        async function loadDoctors() {
            const res = await fetch('/api/doctors');
            const data = await res.json();
            const selects = [document.getElementById('doctorSelect'), document.getElementById('adminDoctorSelect')];
            selects.forEach(select => {
                select.innerHTML = data.data.map(d => `<option value="${d.id}">${d.name} (${d.specialisation})</option>`).join('');
            });
        }

        async function handleBook(e) {
            e.preventDefault();
            const msg = document.getElementById('patient-msg');
            const payload = {
                patientName: document.getElementById('patientName').value,
                doctorId: document.getElementById('doctorSelect').value,
                startTime: document.getElementById('startTime').value,
                symptoms: document.getElementById('symptoms').value
            };

            const res = await fetch('/api/appointments/book', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                msg.className = 'alert alert-success';
                msg.style.display = 'block';
                msg.innerText = `Appointment booked! ID: ${data.data.id}. AI Urgency: ${data.data.preVisitSummary.urgencyLevel}`;
                document.getElementById('bookForm').reset();
            } else {
                msg.className = 'alert alert-error';
                msg.style.display = 'block';
                msg.innerText = data.error;
            }
        }

        async function loadDoctorAppointments() {
            const res = await fetch('/api/appointments');
            const data = await res.json();
            const container = document.getElementById('appointment-list');

            if (data.data.length === 0) {
                container.innerHTML = '<p>No appointments booked yet.</p>';
                return;
            }

            container.innerHTML = data.data.map(a => {
                const badgeClass = a.preVisitSummary.urgencyLevel === 'High' ? 'badge-high' : (a.preVisitSummary.urgencyLevel === 'Medium' ? 'badge-med' : 'badge-low');
                return `
                    <div class="item-card">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${a.patientName} (${a.doctorName})</strong>
                            <span class="badge ${badgeClass}">Urgency: ${a.preVisitSummary.urgencyLevel}</span>
                        </div>
                        <p><strong>Time:</strong> ${a.startTime} | <strong>Status:</strong> ${a.status}</p>
                        <p><strong>Symptoms:</strong> ${a.symptoms}</p>
                        <p><strong>AI Suggested Questions:</strong></p>
                        <ul>${a.preVisitSummary.suggestedQuestions.map(q => `<li>${q}</li>`).join('')}</ul>
                        ${a.postVisitSummary ? `<div style="background:#eef2ff; padding:10px; border-radius:4px;"><strong>Post-visit Summary:</strong> ${a.postVisitSummary.clinicalSummary}<br><strong>Rx:</strong> ${a.postVisitSummary.medicationSchedule}</div>` : `
                            <form onsubmit="handlePostVisit(event, '${a.id}')">
                                <input type="text" placeholder="Clinical Notes" id="notes-${a.id}" required style="margin-bottom:5px;">
                                <input type="text" placeholder="Prescription / Frequency" id="rx-${a.id}" required style="margin-bottom:5px;">
                                <button type="submit" style="padding:6px 12px; background:#10b981; color:#fff; border:none; border-radius:4px; cursor:pointer;">Save Post-Visit Notes</button>
                            </form>
                        `}
                    </div>
                `;
            }).join('');
        }

        async function handlePostVisit(e, id) {
            e.preventDefault();
            const notes = document.getElementById(`notes-${id}`).value;
            const prescription = document.getElementById(`rx-${id}`).value;

            await fetch(`/api/appointments/${id}/notes`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ notes, prescription })
            });
            loadDoctorAppointments();
        }

        async function handleLeave(e) {
            e.preventDefault();
            const msg = document.getElementById('admin-msg');
            const payload = {
                doctorId: document.getElementById('adminDoctorSelect').value,
                date: document.getElementById('leaveDate').value
            };

            const res = await fetch('/api/admin/leave', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            msg.className = 'alert alert-success';
            msg.style.display = 'block';
            msg.innerText = data.message;
        }

        loadDoctors();
    </script>
</body>
</html>
